[project]
name = "painel-f1-25"
version = "2.0.0"
description = "Painel de telemetria e engenheiro de corrida com voz para o F1 25 (telemetria UDP)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
urls = { Repository = "https://github.com/matheeusper/f1-dashboard" }
dependencies = [
    # vozes neurais da Microsoft para o engenheiro (sem ela, o painel usa a voz do Windows)
    "edge-tts>=7.0",
]

[dependency-groups]
# para gerar o nucleo em .exe (build.ps1), que o build-app.ps1 embute no app
build = ["pyinstaller>=6.10"]

[tool.uv]
# conjunto de scripts (nucleo/server.py e modulos ao lado), nao um pacote instalavel
package = false
