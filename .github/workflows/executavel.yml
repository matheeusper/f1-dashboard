# Gera o PainelF1.exe (app nativo, com o nucleo Python embutido) e anexa na release a cada release
# publicada. Tambem pode ser rodado na mao em Actions > "Executavel Windows" > Run workflow
# (nesse caso o .exe fica disponivel como artefato da execucao).
# O Windows do GitHub ja traz o Rust, o Visual Studio com C++, o CMake e o LLVM (para o Whisper).
name: Executavel Windows

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Compilar o app
        shell: pwsh
        run: ./build-app.ps1

      - name: Anexar o executavel na release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" app/target/release/PainelF1.exe --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: PainelF1
          path: app/target/release/PainelF1.exe
