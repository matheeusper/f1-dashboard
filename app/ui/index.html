<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel F1 25</title>
<style>
  :root { --bg: #05070b; --card: #111823; --card2: #1a2433; --linha: #26324a; --texto: #eaf0f8; --dim: #8a96a8;
    --ciano: #2de2e6; --vermelho: #ff4d5a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--texto);
    font-family: "Bahnschrift", "Segoe UI", system-ui, sans-serif; user-select: none; }
  body { display: grid; place-items: center; }
  .caixa { width: min(440px, 86vw); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
  img { width: 120px; height: 120px; }
  h1 { margin: 0; font-size: 34px; letter-spacing: 1px; }
  .sub { color: var(--dim); font-size: 16px; margin-top: -10px; }
  .status { font-size: 17px; color: var(--dim); min-height: 24px; }
  .status::after { content: ''; display: inline-block; width: 1.2em; text-align: left; animation: pontos 1.2s steps(4) infinite; }
  .erro .status::after { display: none; }
  @keyframes pontos { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .msg { display: none; color: var(--vermelho); font-size: 15px; line-height: 1.4; }
  .erro .msg, .erro .acoes { display: flex; }
  .acoes { display: none; flex-direction: column; gap: 10px; width: 100%; }
  .linha { display: flex; gap: 8px; }
  button { flex: 1; font-family: inherit; font-size: 15px; font-weight: 600; color: var(--texto); background: var(--card);
    border: 1px solid var(--linha); border-radius: 10px; padding: 11px 12px; cursor: pointer; }
  button:hover { background: var(--card2); }
  button.on { border-color: var(--ciano); color: var(--ciano); }
  button.principal { background: var(--ciano); color: var(--bg); border-color: var(--ciano); }
</style>
</head>
<body>
  <div class="caixa" id="caixa">
    <img src="icone.png" alt="">
    <h1>PAINEL F1 25</h1>
    <div class="sub" id="sub"></div>
    <div class="status" id="status"></div>
    <div class="msg" id="msg"></div>
    <div class="acoes">
      <div class="linha">
        <button data-f="jogo"></button><button data-f="demo"></button><button data-f="tt"></button>
      </div>
      <div class="linha"><button class="principal" id="bDeNovo"></button><button id="bSair"></button></div>
    </div>
  </div>
<script src="inicio.js"></script>
</body>
</html>
