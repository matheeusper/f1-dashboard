[package]
name = "painel-f1"
version = "2.0.0-dev"
description = "Painel F1 25: telemetria e engenheiro de corrida (app nativo)"
edition = "2021"
publish = false

[[bin]]
name = "PainelF1"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Input_XboxController",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(nucleo_embutido)"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
